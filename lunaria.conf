# lunaria.conf — this installation's settings.  See lunaria.conf.sample.

# The guest's /data and /storage.  Cross Worlds has already downloaded its
# content here; pointing this elsewhere downloads all 13.7 GB again.
LUNARIA_DATA_ROOT=/var/lunaria
LUNARIA_CACHE_DIR=/tmp/lunaria-cache

[com.miHoYo.GenshinImpact]
LUNARIA_PROFILE_PROMPT=1
LUNARIA_SHARED_ASSETS=AssetBundles:AudioAssets:VideoAssets:UnityShaderBin:il2cpp:ctable.dat:hardware_model_config.json:vulkan_gpu_list_config.txt
LUNARIA_PROFILE_SEED_FILES=data_revision:data_versions_persist:res_revision:res_revision_eternal:res_versions_persist:silence_data_versions_persist:silence_revision:base_res_version_hash:audio_revision:ScriptVersion:PatchDone:ChannelName:vulkan_gpu_list_config_engine.txt
LUNARIA_ALSA_DEVICE=sysdefault:CARD=Kazane
LUNARIA_WEB_ENGINE=chrome
LUNARIA_KEYMAP=/root/Dropbox/_Works/特許/QRVN/qfkey/apps/lunaria/keymaps/genshin.conf

[com.netmarble.enn]
LUNARIA_KEYMAP=/root/Dropbox/_Works/特許/QRVN/qfkey/apps/lunaria/keymaps/crossworlds.conf
LUNARIA_WEB_ENGINE=luna
LUNARIA_ALSA_DEVICE=sysdefault:CARD=Kazane

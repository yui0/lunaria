# Build Lunaria release assets and attach them to a GitHub release.
# install.sh downloads exactly these assets:
#   lunaria-<date>-linux-x86_64.tar.gz   lunaria-<date>-linux-aarch64.tar.gz
#   lunaria-<date>-macos-arm64.dmg      lunaria-<date>-macos-x86_64.dmg (Intel)
#
#   git tag 2026.11.5 && git push origin 2026.11.5     # → release with assets
# A manual run (workflow_dispatch) only uploads the files as workflow artifacts.
#
# Windows is not built here (see _make-release.sh --windows / make dist-cross-win).
name: release

on:
  push:
    tags: ['[0-9]*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-22.04 }
          - { arch: aarch64, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # `git describe` for the version string

      # Build on the oldest supported distribution: the bundle uses the host's
      # C library, so a newer build host would not start on older machines.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm cmake clang libclang-dev lld \
            pkg-config libssl-dev libglfw3-dev libgles2-mesa-dev libegl1-mesa-dev \
            libasound2-dev libbsd-dev libunwind-dev zlib1g-dev \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev

      - name: Build dynarmic
        run: make dynarmic-build

      - name: Build
        run: make -j"$(nproc)" lunaria

      # Guest-side AArch64 libm/libc; without them every pow()/sincosf() is an SVC thunk.
      - name: Build guest system libraries
        run: make syslib || echo "syslib unavailable on this runner; shipping without it"

      - name: Package
        run: make dist

      - uses: actions/upload-artifact@v4
        with:
          name: lunaria-linux-${{ matrix.arch }}
          path: lunaria-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  runner: macos-14 }
          # Intel Mac. Not yet proven in CI: a failure here must not block the
          # other assets, so the release job runs even if this one fails.
          - { arch: x86_64, runner: macos-15-intel, experimental: true }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Fetches cmake, boost, GLFW, ANGLE and MoltenVK into .deps/ so the build
      # does not depend on whatever Homebrew has installed.
      - name: Fetch macOS dependencies
        run: make macos-deps

      - name: Build dynarmic
        run: make dynarmic-build

      - name: Build
        run: make -j"$(sysctl -n hw.ncpu)" lunaria

      - name: Build guest system libraries
        run: make syslib || echo "syslib unavailable on this runner; shipping without it"

      # Builds Lunaria.app, ad-hoc codesigns it and wraps it in a .dmg.
      - name: Package
        run: make dist-mac

      # Fail the job if the image does not mount or the bundle does not verify.
      - name: Verify .dmg
        run: |
          dmg="$(ls lunaria-*-macos-*.dmg | head -n1)"
          mp="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -n1 | awk -F'\t' '{print $NF}')"
          test -x "$mp/Lunaria.app/Contents/MacOS/Lunaria"
          codesign --verify --deep --strict "$mp/Lunaria.app"
          hdiutil detach "$mp" -quiet

      - uses: actions/upload-artifact@v4
        with:
          name: lunaria-macos-${{ matrix.arch }}
          path: lunaria-*-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Publish
    needs: [linux, macos]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') && needs.linux.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Lunaria ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.dmg
          generate_release_notes: true   # appends "Full Changelog"
          body: |
            An Android runtime that runs an APK on the desktop: AArch64 and ARM32 guest code on dynarmic, the platform's Java on its own bytecode interpreter, and GLES straight through to the host.

            ### Install (Linux / macOS)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash
            ```

            ### Linux (x86_64 / aarch64)
            ```bash
            tar -xzf lunaria-*-linux-x86_64.tar.gz && cd lunaria-*-linux-x86_64   # or -aarch64
            ./lunaria /path/to/app.apk      # or .xapk / .apks
            ```

            ### macOS (Apple silicon / Intel)
            Open the .dmg, drag `Lunaria.app` where you like, then run
            `/Applications/Lunaria.app/Contents/MacOS/Lunaria /path/to/app.apk`.
            If you downloaded the .dmg in a browser: `xattr -dr com.apple.quarantine /Applications/Lunaria.app`
            (installing with the script above avoids this).

# Coordinates match the standard landscape battle HUD.
# Space/Shift target the dodge control; Q/E/1/2/3 target skills, F attacks.
# Adjust positions if the HUD layout changes.
stick 0.15625 0.792 0.09
button SPACE 0.900 0.694
button SHIFT 0.900 0.694
button E 0.845 0.660
button Q 0.784 0.689
button F 0.845 0.781
button 1 0.770 0.781
button 2 0.902 0.899
button 3 0.925 0.793
# The mouse can be bound like a key: MOUSE3 is the wheel button, WHEELUP/WHEELDOWN are one
# notch of the wheel (a short tap). A bound wheel no longer scrolls; Ctrl+wheel still pinches.
# Example (position is up to the HUD):
#button MOUSE3 0.500 0.500
#button WHEELUP 0.900 0.300
#button WHEELDOWN 0.900 0.400
